services:
  db:
    # Supabase's Postgres distribution: unmodified PostgreSQL with Supabase's
    # curated extensions. The app connects as the image's default user
    # "supabase_admin" with password "postgres".
    image: supabase/postgres:15.8.1.135
    container_name: grenite-realworld-db
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - realworld-db:/var/lib/postgresql/data

  rest:
    # PostgREST: the same component that serves /rest/v1 on a Supabase
    # project. It turns the public schema into the HTTP API the Gren app
    # talks to, so the app needs no database ports.
    image: postgrest/postgrest:v12.2.3
    container_name: grenite-realworld-rest
    depends_on:
      - db
    environment:
      PGRST_DB_URI: postgres://grenite_authenticator:grenite_local_only@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: grenite_app
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_SERVER_PORT: "3000"
    ports:
      - "127.0.0.1:3100:3000"

volumes:
  realworld-db:
